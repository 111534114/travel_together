{# 即時查詢結果的愛心(機票、住宿)。使用前先 {% set fav = live_flight_favorite(...) %} 或 live_hotel_favorite(...) #}
{% if session.get('role') == 'member' %}
{% set is_saved = (fav.kind, fav.key) in booking_live_saved %}
<button class="booking-heart {{ 'is-saved' if is_saved }}" type="button" data-live-fav data-saved="{{ 1 if is_saved else 0 }}" data-csrf="{{ booking_csrf }}" data-fav='{{ fav|tojson }}' aria-label="{{ '取消收藏' if is_saved else '加入我的收藏' }}" title="{{ '取消收藏' if is_saved else '加入我的收藏' }}"><span aria-hidden="true">{{ '♥' if is_saved else '♡' }}</span></button>
{% else %}<a class="booking-heart" href="{{ url_for('login') }}" aria-label="登入後收藏" title="登入後收藏"><span aria-hidden="true">♡</span></a>{% endif %}
