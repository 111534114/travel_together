{# 字體大小選擇：存在這個瀏覽器，每一頁都套用。實際放大縮小靠 CSS 變數 --ui-zoom(site-shell.css / style.css 的 .member-content / .member-main) #}
<div class="font-size-control notranslate" translate="no" role="group" aria-label="字體大小">
  <span class="font-size-label">字體大小</span>
  <span class="font-size-buttons">
    <button type="button" data-font-scale="0.9" aria-pressed="false">小</button>
    <button type="button" data-font-scale="1" aria-pressed="false">中</button>
    <button type="button" data-font-scale="1.15" aria-pressed="false">大</button>
    <button type="button" data-font-scale="1.3" aria-pressed="false">特大</button>
  </span>
</div>
<script>
  (function () {
    var KEY = 'uiFontScale';
    var saved = '1';
    try { saved = localStorage.getItem(KEY) || '1'; } catch (e) {}
    document.documentElement.style.setProperty('--ui-zoom', saved);
    document.querySelectorAll('.font-size-control').forEach(function (box) {
      var mark = function (value) {
        box.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.fontScale === value)); });
      };
      mark(saved);
      box.addEventListener('click', function (event) {
        var button = event.target.closest('button[data-font-scale]');
        if (!button) return;
        var value = button.dataset.fontScale;
        document.documentElement.style.setProperty('--ui-zoom', value);
        try { localStorage.setItem(KEY, value); } catch (e) {}
        document.querySelectorAll('.font-size-control').forEach(function (b) { b.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x.dataset.fontScale === value)); }); });
      });
    });
  })();
</script>
