<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}走吧揪團{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/member_notifications.css') }}">
  <script src="{{ url_for('static', filename='js/google-translate.js') }}"></script>
</head>
<body class="member-body">
  <div class="member-shell">
    <aside class="member-sidenav">
      <a class="brand" href="{{ url_for('member.dashboard') }}"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="走吧揪團"></a>
      <nav>{% include 'partials/member_nav_links.html' %}</nav>
    </aside>
    <main class="member-main">
      {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="message {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
  {% include 'member/_notification_drawer.html' %}
  <script src="{{ url_for('static', filename='js/member_notifications.js') }}" defer></script>
</body></html>
