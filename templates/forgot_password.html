<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>忘記密碼｜Travel Together</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div style="text-align: center; margin-bottom: 10px;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="走吧揪團 Logo" style="max-width: 180px; height: auto; display: inline-block;">
        </div>
        <p class="subtitle" style="margin-top: 4px;">忘記密碼</p>
        <p class="subtitle" style="margin-top: -4px; font-size: 13px;">輸入帳號與註冊時的電子郵件，我們會寄一封重設密碼信給你。</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('forgot_password') }}">

            <div class="form-group">
                <label for="username">帳號</label>
                <input type="text"
                       id="username"
                       name="username"
                       placeholder="請輸入帳號"
                       value="{{ request.form.get('username', '') }}"
                       required>
            </div>

            <div class="form-group">
                <label for="email">電子郵件</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="請輸入註冊時的電子郵件"
                       value="{{ request.form.get('email', '') }}"
                       required>
            </div>

            <button type="submit" class="primary-button">寄送重設密碼信</button>

        </form>

        <p class="auth-link">
            <a href="{{ url_for('login') }}">← 返回登入頁</a>
        </p>

    </div>

</div>

</body>
</html>
