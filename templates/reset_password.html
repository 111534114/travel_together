<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>重設密碼｜Travel Together</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div style="text-align: center; margin-bottom: 10px;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="走吧揪團 Logo" style="max-width: 180px; height: auto; display: inline-block;">
        </div>
        <p class="subtitle" style="margin-top: 4px;">設定新密碼</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">

            <div class="form-group">
                <label for="password">新密碼</label>
                <div class="password-wrapper">
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="至少9碼，需同時包含英文與數字"
                           required>
                    <button type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="顯示密碼">顯示</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirm_password">確認新密碼</label>
                <div class="password-wrapper">
                    <input type="password"
                           id="confirm_password"
                           name="confirm_password"
                           placeholder="請再輸入一次新密碼"
                           required>
                    <button type="button"
                            class="password-toggle"
                            data-target="confirm_password"
                            aria-label="顯示密碼">顯示</button>
                </div>
            </div>

            <button type="submit" class="primary-button">更新密碼</button>

        </form>

        <p class="auth-link">
            <a href="{{ url_for('login') }}">← 返回登入頁</a>
        </p>

    </div>

</div>

<script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>

</body>
</html>
