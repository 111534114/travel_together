{% extends 'member/base.html' %}{% block title %}{{ '編輯' if mode=='edit' else '建立' }}行程｜走吧揪團{% endblock %}{% block content %}
<div class="page-heading"><a href="{{ url_for('member.dashboard') }}">← 返回我的旅程</a><h1>{{ '編輯旅程' if mode=='edit' else '建立一趟新旅程' }}</h1><p>先填寫基本資訊，之後可以邀請旅伴並一起完善行程。</p></div>
<form class="member-form" method="post"><div class="form-grid-member"><label>行程名稱<input name="trip_name" required value="{{ trip.trip_name if trip else '' }}" placeholder="例如：東京賞櫻五日遊"></label><label>旅遊人數<input name="people_count" type="number" min="1" required value="{{ trip.people_count if trip else 1 }}"></label><label>目的地國家<input name="country" required value="{{ trip.country if trip else '' }}" placeholder="例如：日本"></label><label>目的地城市<input name="city" required value="{{ trip.city if trip else '' }}" placeholder="例如：東京"></label><label>開始日期<input name="start_date" type="date" required value="{{ trip.start_date if trip else '' }}"></label><label>結束日期<input name="end_date" type="date" required value="{{ trip.end_date if trip else '' }}"></label><label>團體總預算<input name="total_budget" type="number" min="0" step="1" value="{{ trip.total_budget if trip else 0 }}"></label><label>幣別<select name="currency">{% for c in ['TWD','JPY','USD','KRW','EUR'] %}<option value="{{ c }}" {{ 'selected' if trip and trip.currency==c else '' }}>{{ c }}</option>{% endfor %}</select></label><label class="span-2">公開狀態<select name="visibility"><option value="private" {{ 'selected' if trip and trip.visibility=='private' else '' }}>私人：僅限旅程成員</option><option value="link_only" {{ 'selected' if trip and trip.visibility=='link_only' else '' }}>連結限定：持有連結者可查看</option><option value="public" {{ 'selected' if trip and trip.visibility=='public' else '' }}>公開：所有人可查看</option></select></label><label class="span-2">行程介紹<textarea name="introduction" rows="5" placeholder="寫下這趟旅行的期待與重點…">{{ trip.introduction if trip else '' }}</textarea></label></div><div class="form-actions-member"><a class="member-btn ghost" href="{{ url_for('member.dashboard') }}">取消</a><button class="member-btn primary" type="submit">{{ '儲存變更' if mode=='edit' else '建立行程' }}</button></div></form>
{% endblock %}
