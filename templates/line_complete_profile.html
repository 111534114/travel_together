<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>完成 LINE 登入｜Travel Together</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div style="text-align: center; margin-bottom: 10px;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="走吧揪團 Logo" style="max-width: 170px; height: auto; display: inline-block;">
        </div>
        <h1 style="font-size: 20px; text-align: center;">還差一步就完成了</h1>
        <p class="subtitle" style="margin-top: 4px;">
            {% if full_name %}嗨，{{ full_name }}！{% endif %}
            LINE 沒有提供電子郵件，請補填一個，方便之後接收通知或找回帳號。
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}

                {% for category, message in messages %}
                    <div class="message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}

            {% endif %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('line_complete_profile') }}">

            <div class="form-group">
                <label for="email">電子郵件</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="請輸入電子郵件"
                       value="{{ request.form.get('email', '') }}"
                       title="請輸入正確的電子郵件格式，例如 example@mail.com"
                       required
                       autofocus>
                <small class="form-hint">需符合電子郵件格式，例如 example@mail.com</small>
            </div>

            <button type="submit"
                    class="primary-button">
                完成註冊並登入
            </button>

        </form>

    </div>

</div>

</body>
</html>
