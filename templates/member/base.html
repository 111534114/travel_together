<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}走吧揪團{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="member-body">
  <header class="member-nav"><a class="brand" href="{{ url_for('member.dashboard') }}"><img src="{{ url_for('static', filename='images/logo.png') }}" alt="走吧揪團"></a><nav><a href="{{ url_for('member.dashboard') }}">我的旅程</a><a href="{{ url_for('member.create_trip') }}">建立行程</a><a href="{{ url_for('member.profile') }}">個人資料</a><a href="{{ url_for('logout') }}">登出</a></nav></header>
  <main class="member-main">
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="message {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
</body></html>
