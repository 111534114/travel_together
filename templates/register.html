<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>註冊｜Travel Together</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div style="text-align: center; margin-bottom: 10px;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="走吧揪團 Logo" style="max-width: 170px; height: auto; display: inline-block;">
        </div>
        <h1 style="font-size: 20px; text-align: center;">建立會員帳號</h1>
        <p class="subtitle" style="margin-top: 4px;">開始和朋友一起規劃旅遊</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}

                {% for category, message in messages %}
                    <div class="message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}

            {% endif %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('register') }}">

            <div class="form-group">
                <label for="username">帳號</label>

                <input type="text"
                       id="username"
                       name="username"
                       value="{{ request.form.get('username', '') }}"
                       required>
            </div>

            <div class="form-group">
                <label for="full_name">姓名</label>

                <input type="text"
                       id="full_name"
                       name="full_name"
                       value="{{ request.form.get('full_name', '') }}"
                       required>
            </div>

            <div class="form-group">
                <label for="nickname">暱稱</label>

                <input type="text"
                       id="nickname"
                       name="nickname"
                       value="{{ request.form.get('nickname', '') }}">
            </div>

            <div class="form-group">
                <label for="email">電子郵件</label>

                <input type="email"
                       id="email"
                       name="email"
                       value="{{ request.form.get('email', '') }}"
                       required>
            </div>

            <div class="form-group">
                <label for="password">密碼</label>

                <input type="password"
                       id="password"
                       name="password"
                       required>
            </div>

            <div class="form-group">
                <label for="confirm_password">確認密碼</label>

                <input type="password"
                       id="confirm_password"
                       name="confirm_password"
                       required>
            </div>

            <button type="submit"
                    class="primary-button">
                註冊
            </button>

        </form>

        <p class="auth-link">
            已經有帳號？
            <a href="{{ url_for('login') }}">返回登入</a>
        </p>

    </div>

</div>

</body>
</html>
