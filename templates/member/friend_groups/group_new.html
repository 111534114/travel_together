{% extends 'member/base.html' %}{% block title %}發起揪團｜走吧揪團{% endblock %}{% block content %}
<div class="trip-form-page">
    <div class="page-heading trip-form-heading">
        <a href="{{ url_for('friend_groups.index') }}">← 返回交友揪團</a>
    </div>
    <div class="panel">
        <h1>發起交友揪團</h1>
        <form method="post" action="{{ url_for('friend_groups.new_group') }}" class="form-grid-member">
            <label>揪團名稱 *<input required name="title" maxlength="150"></label>
            <label>日期 *<input required type="date" name="event_date"></label>
            <label>開始時間<input type="time" name="start_time"></label>
            <label>結束時間<input type="time" name="end_time"></label>
            <label>地點<input name="location" maxlength="255"></label>
            <label>人數上限（留空不限制）<input type="number" min="1" name="capacity"></label>
            <label>希望旅伴的步調（選填）<select name="pace_filter"><option value="">不限</option>{% for value, label in pace_labels.items() %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
            <label>希望旅伴的社交傾向（選填）<select name="social_style_filter"><option value="">不限</option>{% for value, label in social_labels.items() %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
            <label class="span-2">說明<textarea name="description" rows="3" placeholder="想做什麼、想找什麼樣的旅伴"></textarea></label>
            <button class="member-btn primary" type="submit">發起揪團</button>
        </form>
    </div>
</div>
{% endblock %}
