{% extends "content_admin/base.html" %}
{% set active_menu = "account" %}
{% block title %}修改密碼｜Travel Together{% endblock %}
{% block page_title %}修改密碼{% endblock %}
{% block content %}
<form method="post" class="admin-account-form admin-section">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>目前密碼<input type="password" name="current_password" required autocomplete="current-password"></label>
    <label>新密碼<input type="password" name="password" required minlength="9" autocomplete="new-password"></label>
    <label>確認新密碼<input type="password" name="confirm_password" required minlength="9" autocomplete="new-password"></label>
    <button type="submit" class="small-button">更新密碼</button>
</form>
{% endblock %}
