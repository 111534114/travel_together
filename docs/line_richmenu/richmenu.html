<!doctype html>
<!--
  LINE 圖文選單圖片原始檔（大型 6 格版型，2500×1686）。
  修改文字後重新產生 PNG：
  "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless=new --hide-scrollbars --window-size=2500,1686 --screenshot=richmenu.png richmenu.html
  格子位置要和 OA Manager 的 A～F 對應：上排 A B C、下排 D E F。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; }
  body {
    font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    background: #EAF8F9;
    display: grid;
    grid-template-columns: 833px 834px 833px;
    grid-template-rows: 843px 843px;
  }
  .cell { padding: 26px; }
  .card {
    position: relative;
    height: 100%;
    border-radius: 48px;
    background: #fff;
    border: 6px solid #CDEBEF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 34px;
    text-align: center;
  }
  .card.chat { background: #FFF8E5; border-color: #FFE29A; }
  .icon {
    width: 270px; height: 270px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #00A9C0;
  }
  .chat .icon { background: #FFC53D; }
  .icon svg { width: 150px; height: 150px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chat .icon svg { stroke: #6B4A00; }
  h2 { font-size: 112px; font-weight: 800; color: #066275; letter-spacing: 6px; }
  .chat h2 { color: #6B4A00; }
  p { font-size: 54px; color: #5C8A94; font-weight: 600; }
  .chat p { color: #9A7A2E; }
  .tag {
    position: absolute; top: 44px; right: 44px;
    font-size: 40px; font-weight: 800; padding: 10px 26px; border-radius: 999px;
    color: #087E96; background: #E3F5F8;
  }
  .chat .tag { color: #8A6200; background: #FFEDB8; }
</style>
</head>
<body>
  <!-- A：我的行程（連結） -->
  <div class="cell"><div class="card">
    <span class="tag">開網頁</span>
    <div class="icon"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 12h18"/></svg></div>
    <h2>我的行程</h2><p>管理所有旅程</p>
  </div></div>
  <!-- B：下一趟旅程（文字） -->
  <div class="cell"><div class="card chat">
    <span class="tag">聊天室回覆</span>
    <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2"/><path d="M9 2h6"/></svg></div>
    <h2>下一趟旅程</h2><p>倒數天數與安排</p>
  </div></div>
  <!-- C：待辦事項（文字） -->
  <div class="cell"><div class="card chat">
    <span class="tag">聊天室回覆</span>
    <div class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8l1.5 1.5L12 7"/><path d="M8 14l1.5 1.5L12 13"/><path d="M14 8h3"/><path d="M14 14h3"/></svg></div>
    <h2>待辦事項</h2><p>投票與分帳</p>
  </div></div>
  <!-- D：建立行程（連結） -->
  <div class="cell"><div class="card">
    <span class="tag">開網頁</span>
    <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></div>
    <h2>建立行程</h2><p>揪團規劃新旅程</p>
  </div></div>
  <!-- E：探索行程（連結） -->
  <div class="cell"><div class="card">
    <span class="tag">開網頁</span>
    <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></div>
    <h2>探索行程</h2><p>看看大家去哪玩</p>
  </div></div>
  <!-- F：帳號設定（連結） -->
  <div class="cell"><div class="card">
    <span class="tag">開網頁</span>
    <div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
    <h2>帳號設定</h2><p>個人資料與 LINE 綁定</p>
  </div></div>
</body>
</html>
