<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>登入｜Travel Together</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div style="text-align: center; margin-bottom: 10px;">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="走吧揪團 Logo" style="max-width: 180px; height: auto; display: inline-block;">
        </div>
        <p class="subtitle" style="margin-top: 4px;">多人協作旅遊行程規劃系統</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}

                {% for category, message in messages %}
                    <div class="message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}

            {% endif %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('login') }}">

            <div class="form-group">
                <label for="username">帳號</label>

                <input type="text"
                       id="username"
                       name="username"
                       placeholder="請輸入帳號"
                       value="{{ request.form.get('username', '') }}"
                       required>
            </div>

            <div class="form-group">
                <label for="password">密碼</label>

                <div class="password-wrapper">
                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="請輸入密碼"
                           required>
                    <button type="button"
                            class="password-toggle"
                            data-target="password"
                            aria-label="顯示密碼">顯示</button>
                </div>
            </div>

            <button type="submit"
                    class="primary-button">
                登入
            </button>

        </form>

        <div class="oauth-divider"><span>或</span></div>

        <a href="{{ url_for('google_login') }}" class="google-button">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.91c1.7-1.57 2.69-3.87 2.69-6.62z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.85.86-3.05.86-2.34 0-4.33-1.58-5.04-3.71H.96v2.33A9 9 0 0 0 9 18z"/>
                <path fill="#FBBC05" d="M3.96 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l3-2.33z"/>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.96l3 2.33C4.67 5.16 6.66 3.58 9 3.58z"/>
            </svg>
            使用 Google 帳號登入
        </a>

        <p class="auth-link">
            還沒有帳號？
            <a href="{{ url_for('register') }}">立即註冊</a>
            <span style="margin: 0 8px; color: #ccc;">|</span>
            <a href="{{ url_for('visitor') }}" style="color: #64748b;">👈 返回訪客 Demo 頁面</a>
        </p>

    </div>

</div>

<script src="{{ url_for('static', filename='js/password-toggle.js') }}"></script>

</body>
</html>
